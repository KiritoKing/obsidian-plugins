name: Build and publish release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ github.ref_name }}

jobs:
  linux-and-plugins:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun run audit:public
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate release version
        run: bun -e 'import {releaseVersion} from "./scripts/release-artifacts.ts"; const v=releaseVersion(process.env.RELEASE_VERSION); for (const p of ["package.json","packages/extension/package.json","packages/obsidian/manifest.json"]) {if ((await Bun.file(p).json()).version!==v) throw new Error("Release version mismatch");}'
      - run: bun run check
      - run: bun x playwright install --with-deps chromium
      - run: bun run test:browser
      - name: Build signed Chrome CRX and matching ZIP
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: bun run scripts/package-chrome.ts --output .output/release
      - name: Exercise signed release contents and identity
        run: bun run scripts/test-browser.ts --release-zip ".output/release/browser-profile-title-bridge-${RELEASE_VERSION}.zip"
      - run: bun run scripts/package-obsidian.ts --output .output/release
      - run: bun run scripts/package-native-host.ts --output .output/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-and-plugins
          path: .output/release/*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  macos-host:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun run audit:public
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build and smoke-test macOS arm64 host
        run: |
          bun -e 'if(process.platform!=="darwin" || process.arch!=="arm64") throw new Error("Unexpected runner architecture")'
          bun run --filter @chlrc/browser-profile-title-host build
          bun run scripts/package-native-host.ts --output .output/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-host
          path: .output/release/*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  publish:
    needs: [linux-and-plugins, macos-host]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun run audit:public
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: .output/release
      - name: Verify artifacts, stage release and read back uploads before publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run scripts/publish-release.ts
